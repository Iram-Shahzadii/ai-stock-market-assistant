# Render Blueprint: deploys the FastAPI backend as one free web service.
# On the free plan there is no Redis/Celery worker, so background jobs use the
# built-in local worker (JOBS_MODE=local) and the sandbox runs as an isolated subprocess.
services:
  - type: web
    name: ai-stock-assistant-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: JOBS_MODE
        value: local
      - key: MCP_MODE
        value: auto
      - key: GEMINI_API_KEY
        sync: false # you paste it in the Render dashboard, never in git
      - key: CORS_ORIGINS
        sync: false # your Vercel URL, e.g. https://ai-stock-market-assistant.vercel.app
